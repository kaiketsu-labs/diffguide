<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Retry status</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; color: #1f2328; }
    h1 { display: flex; align-items: center; gap: .5rem; border-bottom: 1px solid #d0d7de; padding-bottom: .3rem; }
    .badge { padding: 0 .5rem; border-radius: 1rem; background: #ddf4ff; color: #0969da; font-size: .85rem; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #d0d7de; padding: .4rem .6rem; text-align: left; }
    button { padding: .4rem .9rem; border-radius: 6px; border: 1px solid #1f883d; background: #1f883d; color: #fff; }
  </style>
</head>
<body>
  <h1><img src="../assets/logo.svg" alt="" width="32" height="32"> Retry status <span class="badge">v2</span></h1>
  <p>The client retries failed requests with exponential backoff and gives up early on <code>401</code> and <code>404</code>.</p>
  <h2>Settings</h2>
  <table>
    <tr><th>Setting</th><th>Value</th></tr>
    <tr><td>Attempts</td><td>4</td></tr>
    <tr><td>First delay</td><td>200 ms</td></tr>
    <tr><td>Max delay</td><td>5 s</td></tr>
  </table>
  <h2>Latency</h2>
  <img src="../assets/chart.png" alt="Latency chart" width="100%">
  <p><button type="button">Retry now</button></p>
</body>
</html>
