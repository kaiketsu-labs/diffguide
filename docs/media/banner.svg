    <use href="#companion" transform="translate(62 61) scale(.234375)"/>
    <text x="134" y="99" fill="#1B2630" font-size="30" font-weight="650">DiffGuide</text>
    <text x="66" y="216" fill="#1B2630" font-size="54" font-weight="650" letter-spacing="-1.8">Your guide through</text>
    <text x="66" y="279" fill="#1E8463" font-size="54" font-weight="650" letter-spacing="-1.8">code changes.</text>
    <text x="68" y="340" fill="#4E5D69" font-size="21">Ask about any line. Your agent answers in the thread.</text>
    <text x="68" y="371" fill="#4E5D69" font-size="21">You decide what to accept and when the review is done.</text>
    <g transform="translate(688 67)">
      <rect width="686" height="426" rx="13" fill="#1D222B" stroke="#4C5664"/>
      <path d="M0 38h686" stroke="#38414E"/>
      <circle cx="21" cy="19" r="4" fill="#B28278"/><circle cx="37" cy="19" r="4" fill="#B3A27F"/><circle cx="53" cy="19" r="4" fill="#7EAB99"/>
      <text x="80" y="24" fill="#B6C0CC" font-size="12">#42 Retry uploads with a timeout</text>
      <text x="606" y="24" fill="#7F8C9B" font-size="12" text-anchor="end">DiffGuide</text>
      <text x="22" y="64" fill="#8E9AA8" font-size="13" font-weight="650">Overview</text>
      <text x="101" y="64" fill="#F2F3F4" font-size="13" font-weight="650">Code</text>
      <rect x="97" y="73" width="37" height="2" fill="#F2F3F4"/>
      <text x="656" y="64" text-anchor="end" font-size="12"><tspan fill="#8E9AA8">Files / </tspan><tspan fill="#F2F3F4" font-weight="650">Guide</tspan></text>
      <path d="M0 75h686" stroke="#323A46"/><text x="22" y="98" fill="#8E9AA8" font-size="12">Step 2 of 4</text><rect x="96" y="84" width="62" height="20" rx="10" fill="#4A2C2E"/><text x="127.0" y="98" text-anchor="middle" fill="#F4A7A1" font-size="11" font-weight="600">Critical</text><text x="22" y="124" fill="#F2F3F4" font-size="15" font-weight="650">Count a timeout as a failed attempt</text><rect x="590" y="113" width="13" height="13" rx="3" fill="none" stroke="#66717E"/><text x="610" y="124" fill="#C7D2DF" font-size="12">Viewed</text><use href="#companion" transform="translate(24 142) scale(.078125)"/><text x="56" y="157" fill="#C9D2DC" font-size="13">Three slow calls now end the loop instead of hanging it.</text><g font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="13"><rect x="16" y="179" width="654" height="22" fill="#3B2A2E"/><text x="24" y="194" fill="#6C7989">14</text><text x="54" y="194" fill="#6C7989">-</text><text x="70" y="194" xml:space="preserve"><tspan fill="#C792D4">    return </tspan><tspan fill="#C792D4">await </tspan><tspan fill="#DCDCAA">operation</tspan><tspan fill="#D5DAE1">()</tspan></text><rect x="16" y="201" width="654" height="22" fill="#2B3B2F"/><text x="24" y="216" fill="#6C7989">14</text><text x="54" y="216" fill="#6C7989">+</text><text x="70" y="216" xml:space="preserve"><tspan fill="#C792D4">    try</tspan><tspan fill="#D5DAE1">:</tspan></text><rect x="16" y="223" width="654" height="22" fill="#2B3B2F"/><text x="24" y="238" fill="#6C7989">15</text><text x="54" y="238" fill="#6C7989">+</text><text x="70" y="238" xml:space="preserve"><tspan fill="#C792D4">        return </tspan><tspan fill="#C792D4">await </tspan><tspan fill="#DCDCAA">wait_for</tspan><tspan fill="#D5DAE1">(operation(), </tspan><tspan fill="#9CDCFE">timeout</tspan><tspan fill="#D5DAE1">)</tspan></text><rect x="16" y="245" width="654" height="22" fill="#2B3B2F"/><text x="24" y="260" fill="#6C7989">16</text><text x="54" y="260" fill="#6C7989">+</text><text x="70" y="260" xml:space="preserve"><tspan fill="#C792D4">    except </tspan><tspan fill="#DCDCAA">TimeoutError</tspan><tspan fill="#D5DAE1">:</tspan></text></g><rect x="40" y="268" width="614" height="120" rx="8" fill="#282F39" stroke="#52616E"/><text x="56" y="290" fill="#8E9AA8" font-size="11" font-weight="600">LOCAL</text><text x="98" y="290" fill="#E6EAF0" font-size="12" font-weight="600">Timeout per attempt</text><circle cx="68" cy="316" r="12" fill="#3A4452"/><text x="68" y="320" text-anchor="middle" fill="#D5DCE5" font-size="10" font-weight="650">FS</text><text x="90" y="321" fill="#E0E5EC" font-size="13">Does a timeout use up an attempt?</text><use href="#companion" transform="translate(58 340) scale(.078125)"/><text x="90" y="355" fill="#D0D8E2" font-size="13">Yes. <tspan font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" fill="#B5CEA8">TimeoutError</tspan> counts as a failure, so the loop ends.</text><text x="40" y="408" fill="#8E9AA8" font-size="12">Next: 3. Read the timeout from settings  →</text>
      <text x="0" y="455" fill="#5C6B78" font-size="12">Follow the agent's guide. Ask at any line. Tick it Viewed.</text>
    </g>
    <text x="1373" y="530" text-anchor="end" fill="#7A8691" font-size="11">Illustration · sample PR</text>
