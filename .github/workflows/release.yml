name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - uses: actions/checkout@v5
        if: ${{ steps.release.outputs.release_created }}

      - name: Setup Node.js
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        if: ${{ steps.release.outputs.release_created }}
        run: npm ci --ignore-scripts

      - name: Check TypeScript
        if: ${{ steps.release.outputs.release_created }}
        run: npm run typecheck

      - name: Run regression tests
        if: ${{ steps.release.outputs.release_created }}
        run: npm test

      - name: Build VSIX
        if: ${{ steps.release.outputs.release_created }}
        id: build
        run: |
          npm run package
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          cp "${NAME}-${VERSION}.vsix" "${NAME}.vsix"
          echo "vsix=${NAME}-${VERSION}.vsix" >> "$GITHUB_OUTPUT"
          echo "vsix_latest=${NAME}.vsix" >> "$GITHUB_OUTPUT"

      - name: Upload VSIX to GitHub Release
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.release.outputs.tag_name }}" "${{ steps.build.outputs.vsix }}" "${{ steps.build.outputs.vsix_latest }}" --clobber

      - name: Publish to VS Code Marketplace
        if: ${{ steps.release.outputs.release_created }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          USE_OIDC: ${{ vars.VSCE_USE_OIDC }}
        run: |
          if [ -n "$VSCE_PAT" ]; then
            npx --yes @vscode/vsce publish --packagePath "${{ steps.build.outputs.vsix }}" -p "$VSCE_PAT"
          elif [ "$USE_OIDC" = "true" ]; then
            npx --yes @vscode/vsce publish --packagePath "${{ steps.build.outputs.vsix }}" --oidc
          else
            echo "Skipping VS Code Marketplace publishing"
          fi

      - name: Publish to Open VSX Registry
        if: ${{ steps.release.outputs.release_created }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -n "$OVSX_PAT" ]; then
            npx --yes ovsx publish "${{ steps.build.outputs.vsix }}" -p "$OVSX_PAT"
          else
            echo "Skipping Open VSX publishing"
          fi
