name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish, such as v0.6.0
        required: true

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Tag only after publishing, so a failed publish leaves the merged release PR pending for a re-run.
      - uses: googleapis/release-please-action@v5
        if: ${{ github.event_name == 'push' }}
        id: pr
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

      # release-please adds each release below "## Unreleased"; move the written notes into it.
      - uses: actions/checkout@v7
        if: ${{ steps.pr.outputs.pr }}
        with:
          ref: ${{ fromJSON(steps.pr.outputs.pr).headBranchName }}

      - name: Move unreleased notes into the release PR
        if: ${{ steps.pr.outputs.pr }}
        run: |
          node scripts/release-notes.mjs CHANGELOG.md
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "docs(changelog): move unreleased notes into the release"
            git push
          fi

      - name: Find merged release PR awaiting its tag
        if: ${{ github.event_name == 'push' }}
        id: pending
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA=$(gh pr list --repo "$GITHUB_REPOSITORY" --state merged --base main --label "autorelease: pending" --json mergeCommit -q '.[0].mergeCommit.oid')
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: ${{ steps.pending.outputs.sha || inputs.tag }}
        with:
          ref: ${{ steps.pending.outputs.sha || inputs.tag }}

      - name: Setup Node.js
        if: ${{ steps.pending.outputs.sha || inputs.tag }}
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        if: ${{ steps.pending.outputs.sha || inputs.tag }}
        run: npm ci --ignore-scripts

      - name: Check TypeScript
        if: ${{ steps.pending.outputs.sha || inputs.tag }}
        run: npm run typecheck

      - name: Run regression tests
        if: ${{ steps.pending.outputs.sha || inputs.tag }}
        run: npm test

      - name: Build VSIX
        if: ${{ steps.pending.outputs.sha || inputs.tag }}
        id: build
        run: |
          npm run package
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          cp "${NAME}-${VERSION}.vsix" "${NAME}.vsix"
          echo "vsix=${NAME}-${VERSION}.vsix" >> "$GITHUB_OUTPUT"
          echo "vsix_latest=${NAME}.vsix" >> "$GITHUB_OUTPUT"

      - name: Publish to VS Code Marketplace
        if: ${{ steps.pending.outputs.sha || inputs.tag }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          USE_OIDC: ${{ vars.VSCE_USE_OIDC }}
        run: |
          if [ -n "$VSCE_PAT" ]; then
            npx --yes @vscode/vsce publish --packagePath "${{ steps.build.outputs.vsix }}" -p "$VSCE_PAT" --skip-duplicate
          elif [ "$USE_OIDC" = "true" ]; then
            npx --yes @vscode/vsce publish --packagePath "${{ steps.build.outputs.vsix }}" --oidc --skip-duplicate
          else
            echo "Skipping VS Code Marketplace publishing"
          fi

      - name: Publish to Open VSX Registry
        if: ${{ steps.pending.outputs.sha || inputs.tag }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -n "$OVSX_PAT" ]; then
            npx --yes ovsx publish "${{ steps.build.outputs.vsix }}" -p "$OVSX_PAT" --skip-duplicate
          else
            echo "Skipping Open VSX publishing"
          fi

      - uses: googleapis/release-please-action@v5
        if: ${{ steps.pending.outputs.sha }}
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

      - name: Upload VSIX to GitHub Release
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.release.outputs.tag_name }}" "${{ steps.build.outputs.vsix }}" "${{ steps.build.outputs.vsix_latest }}" --clobber
