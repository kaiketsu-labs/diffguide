name: PR title

# Squash merges use the PR title as the commit subject, which release-please reads.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional:
    name: Conventional title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            revert
            chore
            style
            test
            build
            ci
          requireScope: true
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: The subject "{subject}" must start lowercase.
