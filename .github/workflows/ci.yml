name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Check TypeScript
        run: npm run typecheck
      - name: Run regression tests
        run: npm test
      - name: Package VSIX
        run: npm run package
      - name: Upload installable extension
        uses: actions/upload-artifact@v7
        with:
          name: diffguide-vsix
          path: '*.vsix'
          if-no-files-found: error
          retention-days: 14

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Package VSIX
        run: npm run package
      - uses: docker/setup-buildx-action@v4
      - name: Build the VS Code image
        uses: docker/build-push-action@v7
        with:
          context: test/e2e
          load: true
          tags: diffguide-e2e
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Drive the local review flow
        run: docker run --rm --init -v "$PWD":/work diffguide-e2e
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: .render/e2e/
          if-no-files-found: ignore
          retention-days: 7

  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: pre-commit/action@v3.0.1
        env:
          # The check job runs the type check with installed dependencies.
          SKIP: tsc
