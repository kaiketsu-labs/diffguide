name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Check TypeScript
        run: npm run typecheck
      - name: Run regression tests
        run: npm test
      - name: Package VSIX
        run: npm run package
      - name: Upload installable extension
        uses: actions/upload-artifact@v7
        with:
          name: diffguide-vsix
          path: '*.vsix'
          if-no-files-found: error
          retention-days: 14

  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Squash merges use the PR title as the commit subject, which release-please reads.
      - name: Check PR title
        if: ${{ github.event_name == 'pull_request' }}
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|docs|revert|chore|style|test|build|ci)\([a-z0-9._/-]+\)!?: [^A-Z]'
          if ! [[ "$TITLE" =~ $pattern ]]; then
            echo "::error::PR title must be <type>(<scope>): <lowercase subject>, got: $TITLE"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: pre-commit/action@v3.0.1
        env:
          # The check job runs the type check with installed dependencies.
          SKIP: tsc
